services:

  postgres:
    image: postgres:17
    container_name: postgres_auth
    restart: always
    env_file:
      - ./backend/.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build:
      context: ./backend
    container_name: project_backend
    restart: always
    env_file:
      - ./backend/.env
    depends_on:
      - postgres
    volumes:
      - ./backend:/app
    expose:
      - "8000"

  frontend:
    build:
      context: ./frontend
    container_name: project_frontend
    restart: always
    env_file:
      - ./frontend/.env
    depends_on:
      - backend
    expose:
      - "3000"

  nginx:
    image: nginx:latest
    container_name: project_nginx
    restart: always
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/dev.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro

volumes:
  postgres_data: